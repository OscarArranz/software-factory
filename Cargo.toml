[package]
name = "software-factory"
version = "0.1.0"
edition = "2024"

[workspace]
members = ["crates/api-types", "crates/web-ui"]
default-members = ["."]
resolver = "3"

[[bin]]
name = "sf"
path = "src/main.rs"

[dependencies]
axum = "0.8"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread"] }
tower-http = { version = "0.6", features = ["cors"] }
uuid = { version = "1", features = ["v4", "serde"] }
software-factory-api-types = { path = "crates/api-types" }

[dev-dependencies]
http-body-util = "0.1"
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
